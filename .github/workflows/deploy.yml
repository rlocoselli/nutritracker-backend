name: Deploy Nutritracker

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/nutritracker-backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"

            {
              echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}"
              echo "MISTRAL_MODEL=${{ secrets.MISTRAL_MODEL || 'mistral-small-latest' }}"
              echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              echo "MOBILE_AUTH_VERIFY_URL=${{ secrets.MOBILE_AUTH_VERIFY_URL }}"
              echo "MOBILE_API_BASE_URL=${{ secrets.MOBILE_API_BASE_URL || 'https://api.nutritiontracker.fr/api' }}"
              echo "WEB_SESSION_SECRET=${{ secrets.WEB_SESSION_SECRET }}"
              echo "DB_HOST=${{ secrets.DB_HOST }}"
              echo "DB_USER=${{ secrets.DB_USER }}"
              echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
              echo "DB_NAME=${{ secrets.DB_NAME }}"
              echo "DB_PORT=${{ secrets.DB_PORT }}"

              if [ -n "${{ secrets.OPENAI_MODEL }}" ]; then
                echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}"
              else
                echo "OPENAI_MODEL=gpt-4.1-mini"
              fi
            } > .env

            for var_name in GOOGLE_CLIENT_ID WEB_SESSION_SECRET DB_HOST DB_USER DB_PASSWORD DB_NAME DB_PORT; do
              if ! grep -q "^${var_name}=.\+" .env; then
                echo "❌ Missing ${var_name} in generated .env"
                exit 1
              fi
            done

            if ! grep -qE '^(MISTRAL_API_KEY|OPENAI_API_KEY)=.+' .env; then
              echo "❌ At least one AI provider key must be configured"
              exit 1
            fi

            docker compose down --remove-orphans || true
            if ! docker compose up -d --build; then
              echo "❌ docker compose up failed. Showing diagnostics."
              docker compose -f docker-compose.yml ps || true
              docker compose -f docker-compose.yml logs --tail=300 nutritracker-backend || true
              exit 1
            fi

            echo "⏳ Waiting for container state"
            for i in $(seq 1 60); do
              CONTAINER_STATE=$(docker inspect --format='{{.State.Status}}' nutritracker-backend 2>/dev/null || echo "missing")
              RESTART_COUNT=$(docker inspect --format='{{.RestartCount}}' nutritracker-backend 2>/dev/null || echo "0")
              echo "container state: ${CONTAINER_STATE}, restarts: ${RESTART_COUNT}"

              if [ "${RESTART_COUNT}" -ge 3 ]; then
                echo "❌ Container unstable (too many restarts). Showing logs."
                docker compose -f docker-compose.yml ps || true
                docker compose -f docker-compose.yml logs --tail=200 nutritracker-backend || true
                exit 1
              fi

              if [ "${CONTAINER_STATE}" = "running" ]; then
                break
              fi

              sleep 5
            done

            echo "⏳ Waiting for app on http://127.0.0.1:8086/api/health"
            for i in $(seq 1 60); do
              if curl -fsS "http://127.0.0.1:8086/api/health" >/dev/null; then
                echo "✅ App is reachable on port 8086"
                exit 0
              fi
              sleep 5
            done

            echo "❌ App did not become ready on port 8086"
            docker compose -f docker-compose.yml ps || true
            docker compose -f docker-compose.yml logs --tail=200 nutritracker-backend || true
            exit 1
